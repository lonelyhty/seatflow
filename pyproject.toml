[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seatflow-chaoxing"
dynamic = ["version"]
description = "SeatFlow: a Windows desktop scheduler for Chaoxing library seats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "SeatFlow contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "httpx[http2]>=0.28,<1",
    "lxml>=5,<7",
    "cryptography>=44,<51",
    "playwright>=1.49,<2",
]

[project.urls]
Homepage = "https://github.com/lonelyhty/seatflow"
Issues = "https://github.com/lonelyhty/seatflow/issues"

[project.scripts]
seatflow = "seat_reserver_batch:main"
seatflow-single = "seat_reserver_app:main"

[project.gui-scripts]
seatflow-gui = "seat_reserver.batch_gui:main"

[tool.setuptools]
packages = ["seat_reserver"]
py-modules = ["seat_reserver_app", "seat_reserver_batch"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "seat_reserver.__version__"}

[tool.setuptools.package-data]
seat_reserver = ["BATCH_README.md"]
