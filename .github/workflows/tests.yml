name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package and browser
        run: |
          python -m pip install -e .
          python -m playwright install chromium
      - name: Offline tests with temporary account storage
        run: python scripts/check.py
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Check CLI imports
        run: |
          seatflow --help
          seatflow-single --help
          python -m seat_reserver.protocol_runner --help
